name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ChibiDoll-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    name: Build iOS IPA (Swift)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project iosApp/ChibiDoll.xcodeproj \
            -scheme ChibiDoll \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ChibiDoll.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Verify Bundled Assets & Package IPA
        run: |
          APP_PATH="build/ChibiDoll.xcarchive/Products/Applications/ChibiDoll.app"
          ls -la "$APP_PATH"
          test -f "$APP_PATH/catalog.json"
          test -d "$APP_PATH/items"
          test -d "$APP_PATH/thumbnails"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r ChibiDoll.ipa Payload
          ls -lh ChibiDoll.ipa

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChibiDoll-iOS-IPA
          path: ChibiDoll.ipa
          retention-days: 30
