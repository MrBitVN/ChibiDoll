<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" width="1024" height="1536">
  <g id="top_sweater">
    <!-- Puffy Knit Sleeves (covering toddler upper arms) -->
    <!-- Left Sleeve -->
    <path d="M 425 720 C 375 735 345 785 340 855 C 345 880 380 885 400 870 C 410 825 425 785 435 740 Z"
          fill="#93C5FD" stroke="#2D1810" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 345 865 C 360 875 385 870 400 860" fill="none" stroke="#FB7185" stroke-width="6"/>

    <!-- Right Sleeve -->
    <path d="M 599 720 C 649 735 679 785 684 855 C 679 880 644 885 624 870 C 614 825 599 785 589 740 Z"
